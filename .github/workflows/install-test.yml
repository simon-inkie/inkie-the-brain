# Install-test CI: runs the L1-L4 harness on every PR + nightly.
#
# Two jobs:
#   - docker-install-test: full L1-L4 via docker compose on ubuntu-latest
#   - macos-build-test:    native L1 only on macos-latest, catches the
#                          OS-specific issues docker can't (path differences,
#                          BSD vs GNU stat, brew-installed tooling drift)

name: install-test

on:
  pull_request:
  push:
    branches: [master, main]
  schedule:
    # Nightly at 03:00 UTC — catches dependency drift even when no PR lands
    - cron: '0 3 * * *'

jobs:
  docker-install-test:
    name: Docker (Linux) — L1-L4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run install-test (L1-L4)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          docker compose -f install-test/docker-compose.yml run --rm test-runner

      - name: Show Qdrant logs on failure
        if: failure()
        run: docker compose -f install-test/docker-compose.yml logs qdrant

  macos-build-test:
    name: macOS (native) — L1
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: pnpm build
        run: pnpm build

      - name: pnpm typecheck
        run: pnpm typecheck || echo "typecheck has known pre-existing media-filer issues — not gating in v0"
        continue-on-error: true

      - name: pnpm test
        run: pnpm test
