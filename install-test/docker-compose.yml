# Install-test compose. Two services:
#   - test-runner: ubuntu:24.04 + node 22 + pnpm; runs the L1-L4 checks
#   - qdrant:     official qdrant image; the test-runner reaches it at
#                 http://qdrant:6333 via compose internal DNS
#
# Run: `docker compose -f install-test/docker-compose.yml run --rm test-runner`
# Shell: `docker compose -f install-test/docker-compose.yml run --rm test-runner bash`

services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e 'GET /healthz HTTP/1.0\\n\\n' >&3 && grep -q '200 OK\\|status' <&3"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  test-runner:
    build:
      context: ..
      dockerfile: install-test/Dockerfile
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      QDRANT_URL: http://qdrant:6333
      # Required by the brain — supplied at run-time. Passed through from the
      # host so we don't bake keys into the image.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      # Mount the repo read-write so `pnpm install` + `pnpm build` can write
      # node_modules + dist into the test runner's own workspace. We use a
      # named volume for node_modules to avoid stomping the host's copy.
      - ..:/workspace
      - the-brain-test-node-modules:/workspace/node_modules
      - the-brain-test-dist:/workspace/dist

volumes:
  the-brain-test-node-modules:
  the-brain-test-dist:
