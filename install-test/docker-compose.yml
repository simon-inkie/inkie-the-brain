# Install-test compose. Two services:
#   - test-runner: ubuntu:24.04 + node 22 + pnpm; runs the L1-L4 checks
#   - qdrant:     official qdrant image; the test-runner reaches it at
#                 http://qdrant:6333 via compose internal DNS
#
# Run:   `docker compose -f install-test/docker-compose.yml run --rm test-runner`
# Shell: `docker compose -f install-test/docker-compose.yml run --rm test-runner bash`
#
# The repo is bind-mounted READ-ONLY at /workspace; run.sh clones from there to
# /tmp/work inside the container before running anything. This mirrors the
# "user clones from their fresh checkout" path AND keeps the host's /workspace
# (including the host's live dist/ + node_modules) safely untouched.

services:
  qdrant:
    image: qdrant/qdrant:v1.17.0
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e 'GET /healthz HTTP/1.0\\n\\n' >&3 && grep -q '200 OK\\|status' <&3"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  test-runner:
    build:
      context: ..
      dockerfile: install-test/Dockerfile
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      QDRANT_URL: http://qdrant:6333
      # Required by the brain — supplied at run-time. Passed through from the
      # host so we don't bake keys into the image.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      # Repo bind-mounted read-only — run.sh git-clones it into /tmp/work
      # for the actual install. This isolates the test from the host's
      # working tree (dist/, node_modules/) and matches the user-side path.
      - ..:/workspace:ro
